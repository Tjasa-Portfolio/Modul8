<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Types</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script type="module" src="js/listTaskType.js"></script>
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!--NAVIGACIJA-->
    <div class="container">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Tipi nalog</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="listWorker.html"
                  >Seznam Delavcev</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="listTask.html"
                  >Seznam Nalog</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  aria-current="page"
                  href="listDepartment.html"
                  >Seznam Oddelkov</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="listTaskType.html"
                  >Seznam Tipov nalog</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="listTitle.html"
                  >Seznam Nazivov</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>

    <div class="container flex-grow-1">
      <div class="container">
        <div class="row">
          <div class="col-12" id="app">
            <!-- NOV tip naloge-->
            <div class="col-12 py-4" id="app">
              <div class="row">
                <div class="col-10">
                  <h2>Dodaj nov tip naloge</h2>
                </div>
                <div class="col-2">
                  <button
                    type="button"
                    class="btn btn-warning"
                    @click="openAddForm()"
                  >
                    Dodaj
                  </button>
                </div>
              </div>
              <div class="col-12" id="app" v-if="this.openAddFormBoolean">
                <form>
                  <div class="mb-3">
                    <label class="form-label">Id tipa</label>
                    <input
                      v-model="taskType.id"
                      type="text"
                      class="form-control"
                      id="id"
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Naziv tipa</label>
                    <input
                      v-model="taskType.name"
                      type="text"
                      class="form-control"
                      id="name"
                    />
                  </div>
                </form>
                <button
                  @click="sendTaskTypes()"
                  type="submit"
                  class="btn btn-primary"
                >
                  Potrdi
                </button>
              </div>
            </div>
            <!-- TABELA tipov -->
            <h2>Seznam tipov nalog</h2>
            <table class="table table-striped py-4">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Naziv</th>
                </tr>
              </thead>
              <tbody>
                <tr
                  v-for="taskType in taskTypes"
                  @click="selectTaskType(taskType)"
                >
                  <th scope="row">{{taskType.id}}</th>
                  <td>{{taskType.name}}</td>
                  <td>
                    <button
                      @click="deleteTaskType(taskType.id)"
                      type="button"
                      class="btn btn-danger"
                    >
                      Izbriši
                    </button>
                    <button
                      style="margin-left: 10px"
                      type="button"
                      class="btn btn-primary"
                      data-bs-toggle="modal"
                      data-bs-target="#exampleModal"
                    >
                      Spremeni
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>

            <!-- UPDATE tipa MODAL -->

            <!-- Modal -->
            <div
              class="modal fade"
              id="exampleModal"
              tabindex="-1"
              aria-labelledby="exampleModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">
                      Sprememba tipa naloge
                    </h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <form>
                      <div class="mb-3">
                        <label class="form-label">Id tipa</label>
                        <input
                          v-model="taskType.id"
                          type="text"
                          class="form-control"
                          id="id"
                        />
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Naziv tipa</label>
                        <input
                          v-model="taskType.name"
                          type="text"
                          class="form-control"
                          id="name"
                        />
                      </div>
                    </form>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      Zapri
                    </button>
                    <button
                      type="button"
                      class="btn btn-primary"
                      @click="updateTaskType()"
                      data-bs-dismiss="modal"
                    >
                      Shrani
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <footer class="mt-auto bg-light">
        <div
          class="container-fluid text-center p-3"
          style="background-color: rgba(0, 0, 0, 0.2)"
        >
          © 2025 Copyright:
          <span class="text-dark">Tjaša Žilavec za PRSPR</span>
        </div>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
