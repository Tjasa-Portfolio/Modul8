# redirecty any dependabot PR's, that might come into main branch
name: Redirect Dependabot PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  redirect:
    if: >
      github.actor == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: redirect to dependabot branch
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          PR_NUMBER: ${{github.event.pull_request.number}}
        run: |
          gh pr edit "˘PR_NUMBER" \ --repo "GITHUB_REPOSITORY" \ --base dependabot \ --ADD-ASSIGNEE "tJASAzIL"
