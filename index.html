<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script type="module" src="js/listIndex.js"></script>
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!--NAVIGACIJA-->
    <div class="container">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Domov</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html"
                  ><u>Domov</u></a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="listWorker.html"
                  >Seznam Delavcev</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="listTask.html"
                  >Seznam Nalog</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  aria-current="page"
                  href="listDepartment.html"
                  >Seznam Oddelkov</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="listTaskType.html"
                  >Seznam Tipov nalog</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="listTitle.html"
                  >Seznam Nazivov</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>

    <div class="container flex-grow-1">
      <div class="container">
        <div class="row">
          <div class="col-12" id="app">
            <!-- TABELA Nalog status-->
            <div class="row">
              <h3>Seznam končanih nalog</h3>
            </div>
            <table class="table table-striped py-4">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Naslov</th>

                  <th scope="col">Izvajalec</th>
                  <th scope="col">Status</th>
                  <th scope="col">Nujnost</th>
                  <th scope="col">Tip</th>
                </tr>
              </thead>
              <tbody>
                <template v-for="task in tasksByStatus" :key="task.id">
                  <!-- click in se expanda vrstica -->
                  <tr
                    class="clickable-row"
                    data-bs-toggle="collapse"
                    :data-bs-target="`#details-${task.id}`"
                    aria-expanded="false"
                    style="cursor: pointer"
                  >
                    <th scope="row">{{ task.id }}</th>
                    <td>{{ task.name }}</td>
                    <td>
                      {{ task.worker?.name || '' }} {{ task.worker?.surname ||
                      '' }}
                    </td>
                    <td>
                      <img
                        v-if="task.status==='finished'"
                        src="./img/status/check.png"
                        alt="finished"
                        style="width: 28px"
                      />
                      <img
                        v-else-if="task.status==='waiting'"
                        src="./img/status/stop-button.png"
                        alt="waiting"
                        style="width: 28px"
                      />
                      <img
                        v-else
                        src="./img/status/work-in-progress.png"
                        alt="in-progress"
                        style="width: 28px"
                      />
                    </td>
                    <td>
                      <img
                        v-if="task.priority==='high'"
                        src="./img/nujnost/high.png"
                        alt="high"
                        style="width: 28px"
                      />
                      <img
                        v-else-if="task.priority==='medium'"
                        src="./img/nujnost/medium.png"
                        alt="medium"
                        style="width: 28px"
                      />
                      <img
                        v-else
                        src="./img/nujnost/low.png"
                        alt="low"
                        style="width: 28px"
                      />
                    </td>
                    <td>{{ task.taskType?.name || '' }}</td>
                  </tr>

                  <!-- skriti detajli -->
                  <tr class="collapse" :id="`details-${task.id}`">
                    <td colspan="8" class="bg-light">
                      <div class="row">
                        <div class="col-md-4">
                          <strong>Začetek:</strong> {{ task.startDate }}
                        </div>
                        <div class="col-md-4">
                          <strong>Konec:</strong> {{ task.endDate }}
                        </div>
                      </div>
                      <div class="row">
                        <div><strong>Opis:</strong> {{ task.description }}</div>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>

            <!-- TABELA Nalog -->
            <div class="row">
              <h3>Seznam nujnih nalog</h3>
            </div>
            <table class="table table-striped py-4">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Naslov</th>

                  <th scope="col">Izvajalec</th>
                  <th scope="col">Status</th>
                  <th scope="col">Nujnost</th>
                  <th scope="col">Tip</th>
                </tr>
              </thead>
              <tbody>
                <template v-for="task in tasksByPriority" :key="task.id">
                  <!-- click in se expanda vrstica -->
                  <tr
                    class="clickable-row"
                    data-bs-toggle="collapse"
                    :data-bs-target="`#details-${task.id}-a`"
                    aria-expanded="false"
                    style="cursor: pointer"
                  >
                    <th scope="row">{{ task.id }}</th>
                    <td>{{ task.name }}</td>
                    <td>
                      {{ task.worker?.name || '' }} {{ task.worker?.surname ||
                      '' }}
                    </td>
                    <td>
                      <img
                        v-if="task.status==='finished'"
                        src="./img/status/check.png"
                        alt="finished"
                        style="width: 28px"
                      />
                      <img
                        v-else-if="task.status==='waiting'"
                        src="./img/status/stop-button.png"
                        alt="waiting"
                        style="width: 28px"
                      />
                      <img
                        v-else
                        src="./img/status/work-in-progress.png"
                        alt="in-progress"
                        style="width: 28px"
                      />
                    </td>
                    <td>
                      <img
                        v-if="task.priority==='high'"
                        src="./img/nujnost/high.png"
                        alt="high"
                        style="width: 28px"
                      />
                      <img
                        v-else-if="task.priority==='medium'"
                        src="./img/nujnost/medium.png"
                        alt="medium"
                        style="width: 28px"
                      />
                      <img
                        v-else
                        src="./img/nujnost/low.png"
                        alt="low"
                        style="width: 28px"
                      />
                    </td>
                    <td>{{ task.taskType?.name || '' }}</td>
                  </tr>

                  <!-- skriti detajli -->
                  <tr class="collapse" :id="`details-${task.id}-a`">
                    <td colspan="8" class="bg-light">
                      <div class="row">
                        <div class="col-md-4">
                          <strong>Začetek:</strong> {{ task.startDate }}
                        </div>
                        <div class="col-md-4">
                          <strong>Konec:</strong> {{ task.endDate }}
                        </div>
                      </div>
                      <div class="row">
                        <div><strong>Opis:</strong> {{ task.description }}</div>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <footer class="mt-auto bg-light">
        <div
          class="container-fluid text-center p-3"
          style="background-color: rgba(0, 0, 0, 0.2)"
        >
          © 2025 Copyright:
          <span class="text-dark">Tjaša Žilavec za PRSPR</span>
        </div>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
